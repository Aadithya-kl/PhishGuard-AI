# PhishGuard AI — production-style stack.
#
#   cp .env.example .env    # then fill in the REQUIRED values
#   docker compose up -d --build
#   docker compose exec backend python -m app.cli create-admin
#
# Only the web frontend is published. It proxies /api/* to the backend over the
# private network, so the browser talks to a single origin (first-party
# HttpOnly refresh cookie, no CORS). Postgres and Redis are never exposed.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (python -c "import secrets;print(secrets.token_urlsafe(64))")}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-phishguard}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-phishguard}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
  RATE_LIMIT_STORAGE_URI: redis://:${REDIS_PASSWORD}@redis:6379/3
  CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  FORWARDED_ALLOW_IPS: "*"   # backend is only reachable from the private network
  UPLOAD_DIR: /app/uploads
  REPORT_DIR: /app/reports

services:
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [edge, internal]

  backend:
    build: ./backend
    command: ["api"]
    env_file: .env
    environment: *backend-env
    volumes:
      - report_data:/app/reports
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [internal, egress]   # egress for Copilot LLM calls

  worker:
    build: ./backend
    command: ["worker"]
    env_file: .env
    environment: *backend-env
    volumes:
      - report_data:/app/reports
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    networks: [internal, egress]

  beat:
    build: ./backend
    command: ["beat"]
    env_file: .env
    environment: *backend-env
    healthcheck: { disable: true }
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [internal]

  flower:
    build: ./backend
    command: ["flower"]
    env_file: .env
    environment:
      <<: *backend-env
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:-}
    healthcheck: { disable: true }
    ports:
      - "127.0.0.1:5555:5555"
    profiles: [monitoring]
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-phishguard}
      POSTGRES_USER: ${POSTGRES_USER:-phishguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  report_data:

networks:
  edge: {}
  internal:
    internal: true   # no route to the internet
  egress: {}         # workers need outbound HTTPS for threat-intel / LLM APIs
