name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Unit tests
        run: pytest
      - name: Dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off || echo "::warning::pip-audit reported issues"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_INTERNAL_URL: http://localhost:8000
      - run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reported issues"

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phishguard-backend ./backend
      - run: docker build -t phishguard-frontend ./frontend
